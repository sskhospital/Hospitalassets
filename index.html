function saveFbConfig(){
  try{
    const val=$('#fb_cfg_input').value.trim();
    const parsed=JSON.parse(val);
    localStorage.setItem('sk_firebase_cfg',JSON.stringify(parsed));
    if(!D.cfg)D.cfg={};

    saveLocal();
    alert('บันทึกการตั้งค่าแล้ว กำลังเริ่มเชื่อมต่อ Firebase...');
    initFirebase(parsed);
    render();
  }catch(e){
    alert('รูปแบบ JSON ไม่ถูกต้อง: '+e.message);
  }
}
function forcePushFirebase(){
  if(!fbDb)return alert('ยังไม่ได้เชื่อมต่อ Firebase กรุณาบันทึกการตั้งค่าก่อน');
  if(!confirm('ต้องการนำข้อมูลปัจจุบันบนเครื่องนี้ อัปโหลดขึ้นทับบน Firebase หรือไม่?'))return;
  updateSyncStatus('syncing','กำลังอัปโหลดข้อมูลทั้งหมดขึ้น Firebase...');
  lastSyncedJSON=JSON.stringify(D);
  fbDb.ref('sk_db').set(D).then(()=>{
    updateSyncStatus('connected','อัปโหลดขึ้น Firebase สำเร็จ ('+new Date().toLocaleTimeString('th-TH')+')');
    alert('อัปโหลดข้อมูลขึ้น Firebase สำเร็จ ทุกเครื่องจะเห็นข้อมูลนี้ทันที!');
  }).catch(e=>{
    updateSyncStatus('error','อัปโหลดไม่สำเร็จ: '+e.message);
    alert('เกิดข้อผิดพลาด: '+e.message);
  });
}
function forcePullFirebase(){
  if(!fbDb)return alert('ยังไม่ได้เชื่อมต่อ Firebase');
  if(!confirm('ต้องการดึงข้อมูลล่าสุดจาก Firebase มาทับข้อมูลในเครื่องนี้หรือไม่?'))return;
  updateSyncStatus('syncing','กำลังดึงข้อมูลจาก Firebase...');
  fbDb.ref('sk_db').once('value').then(snap=>{
    const remote=snap.val();
    if(remote&&typeof remote==='object'){
      D=remote;
      saveLocal();
      render();
      updateSyncStatus('connected','ดึงข้อมูลจาก Firebase สำเร็จ');
      alert('ดึงข้อมูลจาก Firebase สำเร็จ!');
    }else{
      alert('ยังไม่มีข้อมูลบน Firebase');
    }
  }).catch(e=>{
    alert('เกิดข้อผิดพลาด: '+e.message);
  });
}
function resetFbConfig(){
  if(!confirm('ต้องการตัดการเชื่อมต่อ Firebase และกลับไปใช้ LocalStorage (ออฟไลน์) หรือไม่?'))return;
  localStorage.removeItem('sk_firebase_cfg');
  if(D.cfg)delete D.cfg.firebase;
  saveLocal();
  if(window.firebase&&firebase.apps&&firebase.apps.length>0){
    firebase.apps.forEach(a=>a.delete());
  }
  fbDb=null;fbApp=null;
  updateSyncStatus('offline','โหมดออฟไลน์ (LocalStorage)');
  render();
  alert('สลับมาใช้ LocalStorage เรียบร้อยแล้ว');
}
