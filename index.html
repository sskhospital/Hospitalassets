let fbApp=null,fbDb=null,cloudStatus='offline',cloudErrMsg='';

function getFbConfig(){
  try{
    const stored=localStorage.getItem('sk_firebase_cfg');
    if(stored) return JSON.parse(stored);
  }catch(e){}
  if(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !window.FIREBASE_CONFIG.apiKey.includes('Placeholder')){
    return window.FIREBASE_CONFIG;
  }
  return window.FIREBASE_CONFIG || null;
}

function initFirebase(){
  const cfg = getFbConfig();
  if(!cfg || !cfg.apiKey || cfg.apiKey.includes('Placeholder')){
    cloudStatus = 'offline';
    cloudErrMsg = 'ยังไม่ได้ตั้งค่า Firebase Configuration หรือยังใช้ค่าเริ่มต้น (ตั้งค่าได้ในเมนู API / Cloud)';
    render();
    return;
  }
  try {
    cloudStatus = 'connecting';
    render();
    if(firebase.apps && firebase.apps.length > 0){
      fbApp = firebase.app();
    } else {
      fbApp = firebase.initializeApp(cfg);
    }
    fbDb = firebase.database();

    // Listen to Firebase connection state
    fbDb.ref('.info/connected').on('value', snap => {
      if(snap.val() === true){
        cloudStatus = 'online';
        cloudErrMsg = '';
      } else {
        if(cloudStatus !== 'offline') cloudStatus = 'connecting';
      }
      render();
    });

    // Real-time listener for the main database
    fbDb.ref('sk_db').on('value', snapshot => {
      const val = snapshot.val();
      if(val){
        D = val;
        try{ localStorage.setItem('sk_db', JSON.stringify(D)); }catch(e){}
        cloudStatus = 'online';
        cloudErrMsg = '';
        render();
      } else {
        // Initial push from local seed if cloud is empty
        fbDb.ref('sk_db').set(D).then(()=>{
          cloudStatus = 'online';
          render();
        }).catch(err => {
          cloudErrMsg = err.message;
          render();
        });
      }
    }, err => {
      console.warn('Firebase RTDB Read Error:', err);
      cloudStatus = 'offline';
      cloudErrMsg = err.message;
      render();
    });
  } catch(e) {
    console.warn('Firebase Init Error:', e);
    cloudStatus = 'offline';
    cloudErrMsg = e.message;
    render();
  }
}

// Global Save Handler (LocalStorage + Realtime Firebase Database)

  if(fbDb && cloudStatus === 'online'){
    fbDb.ref('sk_db').set(D).catch(err=>{
      console.warn('Firebase sync error:', err);
    });
  }
};

function saveFbConfig(){
  try{
    const val=$('#fb_cfg_input').value.trim();
    const parsed=JSON.parse(val);
    localStorage.setItem('sk_firebase_cfg', JSON.stringify(parsed));
    alert('บันทึกการตั้งค่า Firebase สำเร็จ กำลังเชื่อมต่อใหม่...');
    initFirebase();
  }catch(e){
    alert('รูปแบบ JSON ไม่ถูกต้อง: '+e.message);
  }
}
function resetFbConfig(){
  if(confirm('ต้องการลบการตั้งค่า Firebase ที่บันทึกไว้ในเบราว์เซอร์หรือไม่?')){
    localStorage.removeItem('sk_firebase_cfg');
    cloudStatus='offline';
    cloudErrMsg='';
    initFirebase();
  }
}
function syncUpToCloud(){
  if(!fbDb){ return alert('ยังไม่ได้เชื่อมต่อกับ Firebase'); }
  fbDb.ref('sk_db').set(D).then(()=>{
    alert('อัปโหลดข้อมูลทั้งหมดขึ้น Firebase Realtime Cloud สำเร็จ!');
  }).catch(err=>{
    alert('เกิดข้อผิดพลาดในการอัปโหลด: '+err.message);
  });
}
function syncDownFromCloud(){
  if(!fbDb){ return alert('ยังไม่ได้เชื่อมต่อกับ Firebase'); }
  fbDb.ref('sk_db').once('value').then(snap=>{
    if(snap.exists()){
      D = snap.val();
      save();
      render();
      alert('ดึงข้อมูลจาก Cloud สำเร็จ!');
    } else {
      alert('ไม่พบข้อมูลบน Cloud');
    }
  }).catch(err=>{
    alert('เกิดข้อผิดพลาด: '+err.message);
  });
}
